<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paperclip Control Plane</title>
  <style>
    :root {
      --bg: #090a0f;
      --surface: #101319;
      --hairline: rgba(255, 255, 255, 0.08);
      --bone: #e9e4d8;
      --muted: #71717a;
      --track: #1f2430;
      --fill: #d4d4d8;
      --ok: #34d399;
      --err: #fb7185;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--bone);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .panel {
      width: 400px;
      padding: 44px 48px 36px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .mark-ring {
      width: 76px;
      height: 76px;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      background: var(--bg);
    }
    .mark-ring svg {
      width: 40px;
      height: 40px;
    }
    h1 {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 30px;
    }
    .progress {
      width: 100%;
      height: 2px;
      background: var(--track);
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      width: 32%;
      background: var(--fill);
      border-radius: 1px;
      animation: sweep 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .panel[data-state="error"] .progress-fill {
      animation: none;
      width: 100%;
      background: var(--err);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 18px;
      max-width: 100%;
    }
    .status-dot {
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      animation: breathe 1.6s ease-in-out infinite;
    }
    .panel[data-state="error"] .status-dot {
      animation: none;
      background: var(--err);
    }
    #status-label {
      font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel[data-state="error"] #status-label {
      color: var(--err);
      white-space: normal;
    }
    @keyframes sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(350%); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress-fill, .status-dot { animation: none; }
      .progress-fill { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="panel" id="panel" data-state="loading">
    <div class="mark-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e9e4d8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </div>
    <h1>Paperclip</h1>
    <div class="subtitle">AI Agent Control Plane</div>
    <div class="progress">
      <div class="progress-fill"></div>
    </div>
    <div class="status">
      <span class="status-dot"></span>
      <span id="status-label">Starting control plane server…</span>
    </div>
  </div>
  <script>
    if (window.paperclipDesktop) {
      window.paperclipDesktop.onStatusUpdate?.((msg) => {
        if (!msg) return;
        var label = document.getElementById("status-label");
        var panel = document.getElementById("panel");
        if (label) label.textContent = msg;
        if (panel) panel.dataset.state = /^error\b/i.test(msg.trim()) ? "error" : "loading";
      });
    }
  </script>
</body>
</html>
